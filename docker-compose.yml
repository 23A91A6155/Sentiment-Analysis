version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentiment-api
    ports:
      - '${API_PORT:-8000}:${API_PORT:-8000}'
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - MODEL_PATH=${MODEL_PATH:-/app/model_output}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sentiment-ui
    ports:
      - '${UI_PORT:-8501}:${UI_PORT:-8501}'
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:${API_PORT:-8000}
      - UI_PORT=${UI_PORT:-8501}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${UI_PORT:-8501}/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
